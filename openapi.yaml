openapi: 3.0.3
info:
  title: Archi Platform API
  version: 1.0.0
  description: API для архитектурной платформы Archi
paths:
  /api/articles/:
    get:
      operationId: apiArticlesList
      description: GET /api/articles/ — List published articles.
      parameters:
      - in: query
        name: mine
        schema:
          type: boolean
        description: Только мои
      - in: query
        name: moderation_status
        schema:
          type: string
          title: Статус модерации
          enum:
          - approved
          - pending
          - rejected
        description: |-
          Статус модерации

          * `pending` - На модерации
          * `approved` - Одобрено
          * `rejected` - Отклонено
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: number
        description: ID автора
      tags:
      - api
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleListList'
          description: ''
  /api/articles/{slug}/:
    get:
      operationId: apiArticlesRetrieve
      description: GET /api/articles/:slug/ — деталь по slug. DELETE — удаление автором.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleDetail'
          description: ''
    delete:
      operationId: apiArticlesDestroy
      description: GET /api/articles/:slug/ — деталь по slug. DELETE — удаление автором.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
