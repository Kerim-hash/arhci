    PatchedProjectUpdate:
      type: object
      description: |-
        Редактирование проекта автором (multipart, PATCH).

        * ``images`` — новые файлы, добавляются к уже загруженным;
        * ``remove_image_ids`` — id картинок проекта, которые нужно удалить;
        * ``preview_image_id`` — id картинки, которая станет обложкой.

        После любого изменения проект снова отправляется на модерацию: содержимое
        поменялось, и одобрение старой версии на новую не распространяется.
      properties:
        title:
          type: string
          title: Название
          maxLength: 300
        description:
          type: string
          title: Описание
          description: Фото-галерею или слайдер можно вставить кнопкой «Галерея» на
            панели редактора. Двойной клик по вставленному блоку открывает его на
            редактирование.
        images:
          type: array
          items:
            type: string
            format: uri
          writeOnly: true
          maxItems: 30
        removeImageIds:
          type: array
          items:
            type: integer
            minimum: 1
          writeOnly: true
        previewImageId:
          type: integer
          writeOnly: true
          nullable: true
    ProjectCreate:
